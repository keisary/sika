services:
  - type: web
    name: sika-web
    runtime: docker
    repo: https://github.com/keisary/sika
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sika-db
          property: connectionString
      - key: SIKA_SECRET_KEY
        generateValue: true
      - key: SIKA_SEED_PIN
        value: 1234
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: SIKA_AGENT_ID
        sync: false
      - key: NOTIF_PROVIDER
        value: console

  - type: worker
    name: sika-worker
    runtime: docker
    repo: https://github.com/keisary/sika
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: "uv run python -m worker.run"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sika-db
          property: connectionString
      - key: SIKA_SECRET_KEY
        sync: false
      - key: SIKA_SEED_PIN
        value: 1234
      - key: NOTIF_PROVIDER
        value: console

databases:
  - name: sika-db
    plan: free
    databaseType: postgres
